# Kit-local semgrep rules. Always loaded (no network needed); the public
# registry packs (p/python, p/owasp-top-ten, ...) are added on top when reachable.
rules:
  - id: kit.requests-no-timeout
    languages: [python]
    severity: WARNING
    message: "requests call without timeout= — hangs forever on a stalled connection. Add timeout=(connect, read)."
    metadata: { category: security, cwe: "CWE-400" }
    patterns:
      - pattern-either:
          - pattern: requests.$M(...)
          - pattern: $S.$M(...)
      - metavariable-regex:
            metavariable: $M
            regex: '^(get|post|put|patch|delete|head|options|request)$'
      - pattern-not: requests.$M(..., timeout=$T, ...)
      - pattern-not: $S.$M(..., timeout=$T, ...)
      - pattern-inside: |
          import requests
          ...

  - id: kit.requests-verify-false
    languages: [python]
    severity: ERROR
    message: "TLS verification disabled (verify=False). Fine for a lab target, never for production traffic — gate it behind a flag."
    metadata: { category: security, cwe: "CWE-295", confidence: HIGH }
    pattern: requests.$M(..., verify=False, ...)

  - id: kit.subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: "subprocess with shell=True and a non-literal command — command injection if any part is user-controlled. Pass a list and drop shell=True."
    metadata: { category: security, cwe: "CWE-78", confidence: MEDIUM }
    patterns:
      - pattern: subprocess.$F($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$F("...", ..., shell=True, ...)

  - id: kit.os-system
    languages: [python]
    severity: WARNING
    message: "os.system() with a built string — use subprocess.run([...]) with an argument list."
    metadata: { category: security, cwe: "CWE-78" }
    patterns:
      - pattern: os.system($X)
      - pattern-not: os.system("...")

  - id: kit.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: "yaml.load without SafeLoader executes arbitrary Python from the document. Use yaml.safe_load()."
    metadata: { category: security, cwe: "CWE-502", confidence: HIGH }
    patterns:
      - pattern: yaml.load($X, ...)
      - pattern-not: yaml.load($X, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($X, yaml.SafeLoader)

  - id: kit.pickle-load-untrusted
    languages: [python]
    severity: WARNING
    message: "pickle deserialisation — RCE if the input is attacker-controlled. Confirm the source is trusted or switch to JSON."
    metadata: { category: security, cwe: "CWE-502" }
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: kit.eval-exec-dynamic
    languages: [python]
    severity: ERROR
    message: "eval()/exec() on a non-literal — arbitrary code execution."
    metadata: { category: security, cwe: "CWE-95", confidence: HIGH }
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: kit.sql-string-format
    languages: [python]
    severity: ERROR
    message: "SQL built with string formatting — SQL injection. Use parameterised queries (execute(sql, params))."
    metadata: { category: security, cwe: "CWE-89", confidence: MEDIUM }
    patterns:
      - pattern-either:
          - pattern: $DB.execute("..." % ..., ...)
          - pattern: $DB.execute("..." + ..., ...)
          - pattern: $DB.execute(f"...", ...)
          - pattern: $DB.execute("...".format(...), ...)
          - pattern: $DB.executemany("..." % ..., ...)
          - pattern: $DB.executemany(f"...", ...)
      - metavariable-regex:
            metavariable: $DB
            regex: '^(?!re$).*'

  - id: kit.flask-debug-true
    languages: [python]
    severity: ERROR
    message: "Flask app.run(debug=True) — Werkzeug debugger is a remote code execution console if reachable."
    metadata: { category: security, cwe: "CWE-489", confidence: HIGH }
    pattern: $APP.run(..., debug=True, ...)

  - id: kit.flask-secret-key-literal
    languages: [python]
    severity: ERROR
    message: "Flask SECRET_KEY is a literal in source — session forgery. Load it from the environment or a secrets store."
    metadata: { category: secret, cwe: "CWE-798", confidence: HIGH }
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config["SECRET_KEY"] = "..."
      - pattern: SECRET_KEY = "..."

  - id: kit.hardcoded-credential-assignment
    languages: [python]
    severity: WARNING
    message: "Looks like a hard-coded credential assigned to $NAME. Move it to an environment variable / secrets manager."
    metadata: { category: secret, cwe: "CWE-798" }
    patterns:
      - pattern: $NAME = "$VALUE"
      - metavariable-regex:
            metavariable: $NAME
            regex: '(?i)^[A-Z_]*(password|passwd|secret|api_key|apikey|token|private_key)[A-Z_]*$'
      - metavariable-regex:
            metavariable: $VALUE
            regex: '^(?!\s*$)(?!.*(example|changeme|placeholder|dummy|xxx|<)).{6,}$'

  - id: kit.weak-hash-for-security
    languages: [python]
    severity: WARNING
    message: "MD5/SHA1 — fine for checksums, not for passwords or signatures. Add usedforsecurity=False if it's a checksum, else use sha256/bcrypt."
    metadata: { category: security, cwe: "CWE-327" }
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False)

  - id: kit.random-for-token
    languages: [python]
    severity: WARNING
    message: "random.* used where a token/secret/password is generated — use the secrets module."
    metadata: { category: security, cwe: "CWE-330" }
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - metavariable-regex:
            metavariable: $F
            regex: '(?i).*(token|secret|password|nonce|salt|otp|key).*'
      - pattern-either:
          - pattern: random.$M(...)
          - pattern: random.random()

  - id: kit.bare-except-pass
    languages: [python]
    severity: INFO
    message: "Bare except that swallows everything (including KeyboardInterrupt) and does nothing — at minimum log it and narrow the exception type."
    metadata: { category: bug }
    pattern-either:
      - pattern: |
          try:
            ...
          except:
            pass
      - pattern: |
          try:
            ...
          except Exception:
            pass

  - id: kit.tempfile-mktemp
    languages: [python]
    severity: WARNING
    message: "tempfile.mktemp() is racy (TOCTOU). Use NamedTemporaryFile / mkstemp."
    metadata: { category: security, cwe: "CWE-377" }
    pattern: tempfile.mktemp(...)

  - id: kit.jinja-autoescape-off
    languages: [python]
    severity: ERROR
    message: "Jinja2 Environment with autoescape disabled — XSS if any template renders user data."
    metadata: { category: security, cwe: "CWE-79", confidence: HIGH }
    patterns:
      - pattern: jinja2.Environment(...)
      - pattern-not: jinja2.Environment(..., autoescape=True, ...)
      - pattern-not: jinja2.Environment(..., autoescape=jinja2.select_autoescape(...), ...)
      - pattern-not: jinja2.Environment(..., autoescape=select_autoescape(...), ...)
