# Kit default mypy config — used only when the repo has no mypy config.
# Deliberately "gradual": catches real type bugs without demanding a fully-typed codebase.
[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
warn_return_any = False
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = True
disallow_incomplete_defs = True
strict_equality = True
show_error_codes = True
pretty = False
exclude = (?x)(^\.review/|^\.venv/|^venv/|^build/|^dist/|/migrations/|^node_modules/)

[mypy-tests.*]
ignore_errors = True
